name: mishwar_driver
description: "MISHWAR Driver Mobile Application - Captains in Yemen"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_analytics: ^10.10.7
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  firebase_crashlytics: ^3.5.7
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.9.4
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  intl: ^0.20.3
  dio: ^5.4.3+1
  audioplayers: ^6.0.0
  wakelock_plus: ^1.2.5
  mishwar_shared:
    path: ../mishwar_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
