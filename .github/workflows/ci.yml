name: MISHWAR QA Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: mishwar-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend critical gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Typecheck, config, security, and critical tests
        run: npm run qa:critical

      - name: Dependency audit signal
        run: npm audit --audit-level=high

  flutter:
    name: Flutter static and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Shared package checks
        working-directory: apps/mishwar_shared
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Customer app checks
        working-directory: apps/customer_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Driver app checks
        working-directory: apps/driver_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

  firebase-config:
    name: Firebase config validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate JSON and environment policy
        run: npm run validate:config

      - name: Validate Firebase rules text is present
        run: |
          test -s ../firebase/firestore.rules
          test -s ../firebase/storage.rules
          test -s ../firebase/firestore.indexes.json
